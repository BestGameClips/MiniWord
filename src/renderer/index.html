<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-animations="on">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MiniWord</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/features.css">
</head>
<body>
  <div id="app">
    <!-- Barre de titre personnalisée -->
    <header id="titlebar">
      <div class="tb-left">
        <!-- Le logo se remplace en changeant assets/logo/logo.svg (aucun code à modifier) -->
        <img id="tb-logo" src="../../assets/logo/logo.svg" alt="" width="18" height="18" draggable="false">
        <span id="tb-appname" class="tb-appname">MiniWord</span>
      </div>
      <div id="tb-title" class="tb-title" aria-live="off"></div>
      <div class="tb-controls">
        <button id="win-min" class="tb-btn" aria-label="Réduire" data-tip="Réduire">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
        <button id="win-max" class="tb-btn" aria-label="Agrandir" data-tip="Agrandir">
          <svg id="win-max-icon" viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
        <button id="win-close" class="tb-btn tb-close" aria-label="Fermer" data-tip="Fermer">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
      </div>
    </header>

    <div id="main">
      <nav id="sidebar" aria-label="Barre latérale"></nav>
      <section id="workspace">
        <div id="tabbar" role="tablist" aria-label="Documents ouverts"></div>
        <div id="banner-area"></div>
        <div id="findbar-area"></div>
        <div id="editor-row">
          <div id="editor-wrap">
            <div id="editor-gutter" aria-hidden="true" hidden></div>
            <pre id="editor-measure" aria-hidden="true"></pre>
            <pre id="editor-layer" class="scroll-sync" aria-hidden="true"></pre>
            <textarea id="editor" class="scroll-sync" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="soft" aria-label="Éditeur de texte" hidden></textarea>
            <div id="empty-state" hidden></div>
          </div>
          <aside id="preview-pane" aria-label="Aperçu Markdown" hidden></aside>
        </div>
        <div id="dev-panel" hidden></div>
      </section>
    </div>

    <footer id="statusbar" aria-label="Barre d'état"></footer>
  </div>

  <div id="drop-overlay" hidden><div>Déposez vos fichiers pour les ouvrir</div></div>
  <div id="overlays"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <!-- Partagé -->
  <script src="../shared/utils.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="../shared/diff.js"></script>
  <script src="../shared/markdown.js"></script>
  <script src="../shared/changelog.js"></script>
  <script src="../shared/readme-generator.js"></script>
  <!-- Logique métier (core) -->
  <script src="../core/history-manager.js"></script>
  <script src="../core/document-manager.js"></script>
  <script src="../core/tab-manager.js"></script>
  <script src="../core/autosave-manager.js"></script>
  <script src="../core/command-manager.js"></script>
  <script src="../core/shortcut-manager.js"></script>
  <!-- Interface -->
  <script src="components/dom.js"></script>
  <script src="components/icons.js"></script>
  <script src="notifications/notifications.js"></script>
  <script src="dialogs/dialogs.js"></script>
  <script src="components/context-menu.js"></script>
  <script src="editor/search-engine.js"></script>
  <script src="editor/text-ops.js"></script>
  <script src="editor/editor.js"></script>
  <script src="editor/find-bar.js"></script>
  <script src="editor/statusbar.js"></script>
  <script src="md/preview.js"></script>
  <script src="dev/dev-console.js"></script>
  <script src="wiki/wiki-viewer.js"></script>
  <script src="wiki/wiki-admin.js"></script>
  <script src="readme/readme-builder.js"></script>
  <script src="whatsnew/whats-new.js"></script>
  <script src="tabs/tabbar.js"></script>
  <script src="sidebar/sidebar.js"></script>
  <script src="settings/settings-panel.js"></script>
  <script src="command-palette/command-palette.js"></script>
  <script src="app/store.js"></script>
  <script src="app/file-actions.js"></script>
  <script src="app/banner.js"></script>
  <script src="app/rpc-bridge.js"></script>
  <script src="app/updates.js"></script>
  <script src="app/commands.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
